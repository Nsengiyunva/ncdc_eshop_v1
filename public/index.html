<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Charset & Responsive Meta -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Title & Description -->
    <title>NCDC E-Shop | Official Online Platform</title>
    <meta
      name="description"
      content="Shop official education materials and resources from the National Curriculum Development Centre. Trusted, secure, and government-approved digital marketplace."
    />
    <meta name="keywords" content="NCDC, E-Shop, Uganda, Education, Curriculum, Books, Government, Official Store, Buy Learning Materials" />
    <meta name="author" content="National Curriculum Development Centre (NCDC)" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://eshop.ncdc.go.ug/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="NCDC E-Shop | Official Website for the National Curriculum Development Center - Uganda." />
    <meta property="og:description" content="Get verified Education content, books and digital materials. A service by the National Curriculum Development Centre, Uganda." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:url" content="https://eshop.ncdc.go.ug/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NCDC E-Shop" />
    <meta name="twitter:description" content="Shop official educational content from NCDC." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Theme -->
    <meta name="theme-color" content="#008000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Fonts & Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- CSP (Uncomment for production with proper domain config) -->
    <!-- 
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      connect-src 'self' https://shopapi.ncdc.go.ug https://ughub.go.ug;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      script-src 'self' 'unsafe-inline';
      img-src 'self' data: https:;
    ">
    -->

    <!-- Accessibility Enhancement -->
    <meta name="accessibility" content="This website follows WCAG 2.1 AA guidelines for accessibility compliance." />
  </head>

  <body>
    <noscript>
      <strong>You need to enable JavaScript to run this app. Some functionality may be limited otherwise.</strong>
    </noscript>

    <div id="root" role="main" aria-label="NCDC E-Shop Root Container"></div>
  </body>
</html>
